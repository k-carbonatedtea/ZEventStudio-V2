[package]
name = "nodeflow-editor"
version = "0.1.0"
edition = "2021"
default-run = "nodeflow-editor"

[dependencies]
gpui = { path = "../zed/crates/gpui" }
gpui_platform = { path = "../zed/crates/gpui_platform", features = ["font-kit"] }
gpui-component = { path = "../gpui-component/crates/component", features = ["tree-sitter", "tree-sitter-yaml"] }
gpui-component-assets = { package = "gpui-kit-assets", path = "../gpui-component/crates/assets" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.10", features = ["v4", "fast-rng", "serde"] }
revfl = { git = "https://github.com/k-carbonatedtea/Revfl" }
roead = { version = "1.0.0", features = ["yaml", "aamp-names", "with-serde"] }
rayon = "1.10"
smol = "2.0"
rfd = "0.17.2"
serde_yaml = "0.9"
msyt = { git = "https://github.com/NiceneNerd/msyt", tag = "v1.3.0" }
regex = "1"
botw-map = { path = "../botw-map" }
rbfres-library = { path = "../RBfresLibrary" }
uking-library = { path = "../UKingLibrary" }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "3b3506ea31154edc04de64debda0e780cba2639c" }
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
# lto = true
# codegen-units = 1
# panic = "abort"
# strip = true

[profile.dev.package.botw-map]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.roead]
opt-level = 3

[profile.dev.package.wiiu_swizzle]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3


[patch.crates-io]
tree-sitter-yaml = { path = "../vendor/tree-sitter-yaml" }
